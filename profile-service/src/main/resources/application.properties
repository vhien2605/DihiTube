spring.application.name=profile-service
server.port=8081
server.servlet.context-path=/profile
#eureka
eureka.client.service-url.defaultZone=http://service-discovery:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

#hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.datasource.url=jdbc:mysql://profile-service-db:3306/profile-db
spring.datasource.username=root
spring.datasource.password=hienhien123@

#kafka
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=profile-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.admin.auto-create=true
#logging.level.org.apache.kafka=DEBUG
logging.level.org.apache.kafka=INFO
logging.level.org.springframework.kafka=INFO